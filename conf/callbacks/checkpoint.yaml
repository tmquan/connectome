# Callbacks Configuration
# Model checkpointing and training callbacks

# Model Checkpoint - based on Adjusted Rand Score (higher is better)
checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: "checkpoints"
  filename: "vista-{epoch:02d}-{val_ari:.4f}"
  save_top_k: 3
  monitor: "val/ari"
  mode: "max"  # ARI: higher is better (1.0 = perfect)
  save_last: true
  save_weights_only: false
  every_n_epochs: 1
  verbose: true

# Early Stopping - based on Adjusted Rand Score
early_stopping:
  _target_: pytorch_lightning.callbacks.EarlyStopping
  monitor: "val/ari"
  patience: 20
  mode: "max"  # ARI: higher is better
  min_delta: 0.001
  verbose: true
  strict: false  # Don't fail if metric not found initially

# Learning Rate Monitor
lr_monitor:
  _target_: pytorch_lightning.callbacks.LearningRateMonitor
  logging_interval: "step"
  log_momentum: false

# Model Summary
model_summary:
  _target_: pytorch_lightning.callbacks.ModelSummary
  max_depth: 3

# Rich Progress Bar
progress_bar:
  _target_: pytorch_lightning.callbacks.RichProgressBar
  refresh_rate: 1
  leave: true

# GPU Stats Monitor (optional)
gpu_stats:
  _target_: pytorch_lightning.callbacks.DeviceStatsMonitor
  cpu_stats: false

# Visualization Callback (TensorBoard image logging)
visualization:
  enabled: true
  log_every_n_steps: 100      # Log images every N training steps
  num_samples: 2              # Number of samples to visualize per batch
  slice_idx: null             # Z-slice to visualize (null = middle)
  embedding_viz_method: "pca" # 'pca' or 'channels' for embedding visualization
  log_on_train: true          # Log during training
  log_on_val: true            # Log during validation
  log_histograms: true        # Log embedding histograms
  histogram_every_n_steps: 500

