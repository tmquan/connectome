# MitoEM 2.0 Data Configuration
# Mitochondria instance segmentation dataset
# Uses nnUNet-style folder structure with NIfTI files

_target_: src.data.datamodule.MitoEM2DataModule

# Data root - point to MitoEM2 folder containing dataset subfolders
data_root: "data/MitoEM2/Dataset001_ME2-Beta/"

# File paths (relative to data_root) - auto-populated from dataset
# For nnUNet format: imagesTr/{name}_0000.nii.gz, labelsTr/{name}.nii.gz
train_image_paths:
  - "imagesTr/me2-beta_train01_0000.nii.gz"
  - "imagesTr/me2-beta_train02_0000.nii.gz"
  - "imagesTr/me2-beta_train03_0000.nii.gz"
train_label_paths:
  - "labelsTr/me2-beta_train01.nii.gz"
  - "labelsTr/me2-beta_train02.nii.gz"
  - "labelsTr/me2-beta_train03.nii.gz"
val_image_paths:
  - "imagesTr/me2-beta_train04_0000.nii.gz"
val_label_paths:
  - "labelsTr/me2-beta_train04.nii.gz"

# Patch configuration
patch_size: [32, 256, 256]  # (D, H, W)

# Sampling
patches_per_volume: 100

# DataLoader configuration
batch_size: 2
num_workers: 4
pin_memory: true

# Caching
cache_volumes: true

# Semantic class: mitochondria = 2 (from nlp_labels registry)
semantic_class_id: 2

# Augmentation
augmentation:
  enabled: true
  random_flip_prob: 0.5
  random_rotate_prob: 0.5
