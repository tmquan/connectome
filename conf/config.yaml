# Master Configuration - VISTA3D Connectomics Adaptation
# Follows cosmed-style Hydra configuration patterns

defaults:
  - model: vista_connectomics
  - data: snemi3d  # Options: snemi3d, mitoem2, combined
  - training: default_trainer
  - callbacks: checkpoint
  - _self_

# Override data config from command line:
#   python main.py data=combined     # Train on SNEMI3D + MitoEM2
#   python main.py data=mitoem2      # Train on MitoEM2 only

project_name: "VISTA_Connectomics"
seed: 42
work_dir: ${hydra:runtime.cwd}

# NLP Label Registry (Global Definition)
# Maps biological entity names to integer IDs for VISTA3D embedding lookup
nlp_labels:
  background: 0
  neuron: 1
  mitochondria: 2
  membrane: 3
  synapse: 4

# Hydra output configuration
hydra:
  run:
    dir: outputs/${project_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${project_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

